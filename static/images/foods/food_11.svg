<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with Gradient -->
  <rect width="800" height="500" fill="url(#grad)" />
  
  <!-- Subtle Geometric Pattern Elements -->
  <circle cx="100" cy="80" r="140" fill="#ffffff" opacity="0.08" />
  <circle cx="720" cy="420" r="180" fill="#ffffff" opacity="0.06" />
  <rect x="600" y="-40" width="220" height="220" rx="40" transform="rotate(25 710 70)" fill="#ffffff" opacity="0.05" />
  
  <!-- Central Card Display -->
  <g filter="url(#shadow)">
    <!-- Food / Restaurant Emblem Icon -->
    <circle cx="400" cy="190" r="105" fill="#ffffff" />
    <text x="400" y="235" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="105" text-anchor="middle">🥪</text>
  </g>
  
  <!-- Badge Pill -->
  <rect x="250" y="325" width="300" height="38" rx="19" fill="#ffffff" opacity="0.22" />
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOASTED MULTI-GRAIN BREAD</text>
  
  <!-- Main Title -->
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">Grilled Veggie Club Sub</text>
  
  <!-- Subtitle -->
  <text x="400" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="500" fill="#ffffff" opacity="0.9" text-anchor="middle">Sandwich</text>
</svg>