{% extends "base.html" %}
{% block title %}Access Denied (403) – Foody Hunters{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width:600px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-size:5rem;line-height:1;margin-bottom:1rem">🚫</div>
  <h1 style="font-size:3.5rem;font-weight:900;color:#EF4444;margin:0">403</h1>
  <h2 style="font-size:1.6rem;font-weight:800;color:var(--text-dark);margin:.5rem 0">Access Forbidden</h2>
  <p style="color:var(--text-muted);font-size:1rem;margin-bottom:2rem;line-height:1.6">
    You don't have administrative or authorized permissions to access this portal page.
  </p>
  <div class="d-flex gap-2 justify-center">
    <a href="/" class="btn btn-primary btn-lg" style="border-radius:var(--radius-pill)">
      <i class="fas fa-home"></i> Back to Safety
    </a>
    <a href="/auth/login" class="btn btn-outline btn-lg" style="border-radius:var(--radius-pill)">
      <i class="fas fa-sign-in-alt"></i> Switch Account
    </a>
  </div>
</div>
{% endblock %}
