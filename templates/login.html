{% extends "base.html" %}
{% block title %}Login – Foody Hunters{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🍔 Foody Hunters</div>
      <div class="auth-subtitle">Welcome back! Sign in to your account</div>
    </div>
    <div class="auth-body">
      <form method="POST" action="/auth/login" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">
            Password
            <a href="/auth/forgot-password" style="float:right;font-size:.8rem;color:var(--primary)">Forgot Password?</a>
          </label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="input-suffix" onclick="togglePassword('password','pwIcon')"
                    style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:.25rem">
              <i class="fas fa-eye" id="pwIcon"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <div class="form-check">
            <input type="checkbox" id="remember_me" name="remember_me">
            <label for="remember_me" style="font-size:.9rem">Remember me for 24 hours</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="justify-content:center;margin-top:.5rem">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="divider"><span>Demo Accounts</span></div>

      <!-- Quick login buttons for demo -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <button class="btn btn-outline btn-sm" onclick="quickLogin('customer@foodiehunter.com','password123')">
          <i class="fas fa-user"></i> Customer
        </button>
        <button class="btn btn-outline btn-sm" onclick="quickLogin('restaurant@foodiehunter.com','password123')">
          <i class="fas fa-store"></i> Restaurant
        </button>
        <button class="btn btn-outline btn-sm" onclick="quickLogin('delivery@foodiehunter.com','password123')">
          <i class="fas fa-motorcycle"></i> Delivery
        </button>
        <button class="btn btn-outline btn-sm" onclick="quickLogin('admin@foodiehunter.com','password123')">
          <i class="fas fa-crown"></i> Admin
        </button>
      </div>
      <p style="text-align:center;font-size:.78rem;color:var(--text-muted);margin-top:.5rem">
        Password for all demo accounts: <strong>password123</strong>
      </p>
    </div>
    <div class="auth-footer">
      Don't have an account? <a href="/auth/register">Create one</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function quickLogin(email, password) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = password;
  document.getElementById('loginForm').submit();
}
</script>
{% endblock %}
