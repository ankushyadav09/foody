{% extends "base.html" %}
{% block title %}Add New Dish – Foody Hunters{% endblock %}

{% block content %}
<div class="page-header" style="background:#1E293B;color:#fff;padding:2.5rem 0;border-bottom:1px solid #334155">
  <div class="container d-flex justify-between align-center flex-wrap gap-2">
    <div>
      <h1 style="font-size:2rem;font-weight:800;color:#fff;margin:0">Add New Food Item</h1>
      <p style="color:#94A3B8;font-size:.9rem;margin-top:.2rem">List a new dish on your online menu with pricing and photo</p>
    </div>
    <a href="/restaurant/menu" class="btn btn-outline" style="border-radius:var(--radius-pill);color:#fff;border-color:#475569">
      <i class="fas fa-arrow-left"></i> Back to Menu
    </a>
  </div>
</div>

<div class="container py-4" style="max-width:700px">
  <div style="background:#fff;border-radius:var(--radius-lg);padding:2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)">
    <form method="POST" action="/restaurant/add-food" enctype="multipart/form-data">
      
      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Dish Name *</label>
        <input type="text" class="form-control" name="name" required placeholder="e.g. Paneer Butter Masala">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Category *</label>
          <select class="form-control" name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.icon }} {{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Food Type *</label>
          <select class="form-control" name="veg_type" required>
            <option value="veg">🟢 Pure Veg</option>
            <option value="non_veg">🔴 Non-Veg</option>
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Price in ₹ *</label>
          <input type="number" step="0.01" class="form-control" name="price" required placeholder="e.g. 249.00">
        </div>
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Initial Availability</label>
          <div style="margin-top:.6rem">
            <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer">
              <input type="checkbox" name="availability" value="1" checked> In Stock & Ready to Order
            </label>
          </div>
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Description</label>
        <textarea class="form-control" name="description" rows="3" placeholder="Describe the ingredients, spices, and portion size..."></textarea>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Food Image URL (Unsplash / Web URL)</label>
        <input type="url" class="form-control" name="image_url" placeholder="https://images.unsplash.com/photo-...">
        <small style="color:var(--text-muted)">Or choose a local file below</small>
      </div>

      <div class="form-group mb-4">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Upload Local Food Photo</label>
        <input type="file" class="form-control" name="image" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" style="justify-content:center;border-radius:var(--radius-pill);font-weight:700">
        <i class="fas fa-plus-circle"></i> Save Food Item to Menu
      </button>

    </form>
  </div>
</div>
{% endblock %}
