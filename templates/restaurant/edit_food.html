{% extends "base.html" %}
{% block title %}Edit Dish – {{ item.name }}{% endblock %}

{% block content %}
<div class="page-header" style="background:#1E293B;color:#fff;padding:2.5rem 0;border-bottom:1px solid #334155">
  <div class="container d-flex justify-between align-center flex-wrap gap-2">
    <div>
      <h1 style="font-size:2rem;font-weight:800;color:#fff;margin:0">Edit Food Item: {{ item.name }}</h1>
      <p style="color:#94A3B8;font-size:.9rem;margin-top:.2rem">Update dish information, category, and pricing</p>
    </div>
    <a href="/restaurant/menu" class="btn btn-outline" style="border-radius:var(--radius-pill);color:#fff;border-color:#475569">
      <i class="fas fa-arrow-left"></i> Back to Menu
    </a>
  </div>
</div>

<div class="container py-4" style="max-width:700px">
  <div style="background:#fff;border-radius:var(--radius-lg);padding:2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)">
    <form method="POST" action="/restaurant/food/edit/{{ item.id }}" enctype="multipart/form-data">
      
      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Dish Name *</label>
        <input type="text" class="form-control" name="name" value="{{ item.name }}" required>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Category *</label>
          <select class="form-control" name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if c.id == item.category_id %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Food Type *</label>
          <select class="form-control" name="veg_type" required>
            <option value="veg" {% if item.veg_type == 'veg' %}selected{% endif %}>🟢 Pure Veg</option>
            <option value="non_veg" {% if item.veg_type == 'non_veg' %}selected{% endif %}>🔴 Non-Veg</option>
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Price in ₹ *</label>
          <input type="number" step="0.01" class="form-control" name="price" value="{{ item.price }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Availability</label>
          <div style="margin-top:.6rem">
            <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer">
              <input type="checkbox" name="availability" value="1" {% if item.availability == 1 %}checked{% endif %}> In Stock & Ready
            </label>
          </div>
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Description</label>
        <textarea class="form-control" name="description" rows="3">{{ item.description or '' }}</textarea>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Current Image</label>
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.5rem">
          <img src="{{ item.image or 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=100&q=80' }}"
               alt="{{ item.name }}" style="width:60px;height:60px;border-radius:var(--radius-sm);object-fit:cover"
               onerror="this.src='https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=100&q=80'">
          <input type="url" class="form-control" name="image_url" value="{{ item.image or '' }}" placeholder="Image URL">
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="form-label" style="font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem">Upload New Image File (Optional)</label>
        <input type="file" class="form-control" name="image" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" style="justify-content:center;border-radius:var(--radius-pill);font-weight:700">
        Update Food Item
      </button>

    </form>
  </div>
</div>
{% endblock %}
