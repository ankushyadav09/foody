{% extends "base.html" %}
{% block title %}Reset Password – Foody Hunters{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height:75vh;display:flex;align-items:center;justify-content:center;padding:3rem 1rem">
  <div class="auth-card" style="max-width:440px;width:100%;background:#fff;border-radius:var(--radius-xl);padding:2.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border)">
    <div style="text-align:center;margin-bottom:1.75rem">
      <div style="font-size:2.8rem;margin-bottom:.5rem">🔑</div>
      <h1 style="font-size:1.6rem;font-weight:800;color:var(--text-dark)">Reset Password</h1>
      <p style="color:var(--text-muted);font-size:.9rem;margin-top:.4rem">
        Enter your registered email address and we'll send you demo password reset instructions.
      </p>
    </div>

    <form method="POST" action="/auth/forgot-password">
      <div class="form-group mb-3">
        <label class="form-label" style="font-weight:600;font-size:.85rem;display:block;margin-bottom:.3rem">Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="justify-content:center;border-radius:var(--radius-pill);font-weight:700">
        Send Reset Link
      </button>

      <div style="text-align:center;margin-top:1.5rem">
        <a href="/auth/login" style="font-size:.88rem;color:var(--primary);font-weight:600">
          <i class="fas fa-arrow-left"></i> Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
